<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { width:1080px; height:1920px; overflow:hidden; background:#000; }
      #root { position:relative; width:100%; height:100%; }
      #root .footage { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; }
      #captions { z-index:2; }
      #prices { z-index:3; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="165.850" data-width="1080" data-height="1920">
      <video id="footage0" class="clip footage" src="assets/parte1.mp4" data-start="0.000" data-duration="4.350" data-track-index="0" data-has-audio="true"></video>
      <video id="footage1" class="clip footage" src="assets/parte2.mp4" data-start="4.350" data-duration="148.790" data-track-index="0" data-has-audio="true"></video>
      <video id="footage2" class="clip footage" src="assets/parte3.mp4" data-start="153.140" data-duration="12.710" data-track-index="0" data-has-audio="true"></video>
      <div id="prices" data-composition-id="prices" data-composition-src="compositions/prices.html" data-start="0" data-duration="165.850" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="165.850" data-track-index="1" data-track-kind="captions" data-width="1080" data-height="1920"></div>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
